# ===============================
# CORE SPRING SETTINGS
# ===============================
spring.profiles.active=prod
spring.application.name=saasno-backend
app.version=@project.version@
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jackson.time-zone=Asia/Jakarta

# ===============================
# SERVER CONFIG
# ===============================
server.port=8000
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.max-connections=200
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ===============================
# DATASOURCE CONFIG
# ===============================
spring.datasource.url=${SAASNO_DATABASE_URL:jdbc:postgresql://localhost:5432/saasno}
spring.datasource.username=${SAASNO_DATABASE_USERNAME:database}
spring.datasource.password=${SAASNO_DATABASE_PASSWORD:database}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# RABBIT MQ CONFIG
# ===============================
spring.rabbitmq.host=${SAASNO_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SAASNO_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SAASNO_RABBITMQ_PASSWORD:admin123}

# ===============================
# REDIS CONFIG
# ===============================
spring.data.redis.host=${SAASNO_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${SAASNO_REDIS_PASSWORD:admin}
spring.data.redis.timeout=6000

# ===============================
# MONGODB CONFIG (audit log)
# ===============================
spring.data.mongodb.uri=${SAASNO_MONGODB_URI:mongodb://database:database@localhost:27017/saasno?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jackson.default-property-inclusion=non_null

# ===============================
# MAIL CONFIG (forgot password, new-device alert)
# ===============================
# Everything about the mail server and the sender is kept in the configuration table, not here: MAIL_HOST, MAIL_PORT, MAIL_USERNAME,
# MAIL_PASSWORD, MAIL_AUTH, MAIL_STARTTLS, MAIL_FROM and MAIL_FROM_NAME. They are changed on the Configuration page without a
# restart. Email is off while MAIL_HOST is empty. Only the connection timeout stays here.
app.mail.timeout-ms=5000

# ===============================
# METRICS (Prometheus)
# ===============================
# Served on its own port, never on the application port, so they are not reachable through the public address. The port is not
# published by Docker; Prometheus reaches it over a shared Docker network. The address stays on this machine unless
# SAASNO_MANAGEMENT_ADDRESS says otherwise (docker-compose sets 0.0.0.0, i.e. every container network).
management.server.port=${SAASNO_MANAGEMENT_PORT:8081}
management.server.address=${SAASNO_MANAGEMENT_ADDRESS:127.0.0.1}
# Only the metrics endpoint is exposed: /actuator/prometheus. Everything else (env, beans, heapdump, ...) stays off.
management.endpoints.web.exposure.include=prometheus
management.endpoints.access.default=none
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=saasno-backend

# ===============================
# API DOCUMENTATION (OpenAPI / Swagger UI)
# ===============================
# Off by default. Set SAASNO_API_DOCS_ENABLED=true in dev/UAT: /swagger-ui.html and /v3/api-docs.
springdoc.api-docs.enabled=${SAASNO_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SAASNO_API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=true

# ===============================
# CUSTOM
# ===============================
app.upload.dir=${user.dir}/uploads/

# Uploads (profile pictures, logo): checked again in the code (AvatarService / AppSettingService)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB